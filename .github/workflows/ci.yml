name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  api-quality:
    name: API quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          enable-cache: false

      - name: Sync frozen API dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Check API lockfile
        working-directory: apps/api
        run: uv lock --check

      - name: Run API unit tests
        working-directory: apps/api
        run: uv run pytest -m "not integration"

      - name: Run Ruff lint
        working-directory: apps/api
        run: uv run ruff check .

      - name: Check Ruff formatting
        working-directory: apps/api
        run: uv run ruff format --check .

      - name: Run Pyright
        working-directory: apps/api
        run: uv run pyright

  postgres-integration:
    name: PostgreSQL integration and migration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      POSTGRES_DB: gia_ci_admin
      POSTGRES_USER: gia_ci
      POSTGRES_PASSWORD: gia_ci_test_only

    services:
      postgres:
        image: postgres:18.4-trixie
        env:
          POSTGRES_DB: gia_ci_admin
          POSTGRES_USER: gia_ci
          POSTGRES_PASSWORD: gia_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gia_ci -d gia_ci_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          enable-cache: false

      - name: Sync frozen API dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Check API lockfile
        working-directory: apps/api
        run: uv lock --check

      - name: Validate migrations on disposable CI database
        working-directory: apps/api
        shell: bash
        run: |
          set -euo pipefail
          database_url="postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}"
          GIA_API_DATABASE_URL="$database_url" uv run alembic heads
          GIA_API_DATABASE_URL="$database_url" uv run alembic upgrade head
          GIA_API_DATABASE_URL="$database_url" uv run alembic current --check-heads
          GIA_API_DATABASE_URL="$database_url" uv run alembic check

      - name: Run PostgreSQL integration tests
        working-directory: apps/api
        run: uv run pytest -m integration --junitxml="${RUNNER_TEMP}/integration.xml"

      - name: Require selected integration tests with zero skips
        working-directory: apps/api
        shell: bash
        run: |
          uv run python - <<'PY'
          import os
          import xml.etree.ElementTree as ET

          report = ET.parse(os.path.join(os.environ["RUNNER_TEMP"], "integration.xml"))
          suites = report.findall(".//testsuite")
          selected = sum(int(suite.attrib.get("tests", "0")) for suite in suites)
          skipped = sum(int(suite.attrib.get("skipped", "0")) for suite in suites)
          print(f"integration selected={selected} skipped={skipped}")
          if selected <= 0 or skipped != 0:
              raise SystemExit("Integration selection gate failed.")
          PY

      - name: Verify PostgreSQL test database cleanup
        if: always()
        working-directory: apps/api
        shell: bash
        run: |
          uv run python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(
              host="127.0.0.1",
              port=5432,
              dbname="postgres",
              user=os.environ["POSTGRES_USER"],
              password=os.environ["POSTGRES_PASSWORD"],
          ) as connection:
              database_rows = connection.execute(
                  "SELECT datname FROM pg_database"
              ).fetchall()
          residual = [
              database_name
              for (database_name,) in database_rows
              if database_name.startswith(("gia_p04e_", "gia_p05d_"))
          ]
          print(f"temporary database residual={len(residual)}")
          if residual:
              raise SystemExit("Temporary PostgreSQL databases remain after CI tests.")
          PY

  web-quality:
    name: Web quality and OpenAPI drift
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: false

      - name: Set up pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: "11.21.0"
          install: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          enable-cache: false

      - name: Install frozen Web dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync frozen API dependencies for OpenAPI generation
        working-directory: apps/api
        run: uv sync --frozen

      - name: Run Web lint
        run: pnpm web:lint

      - name: Check Web formatting
        run: pnpm web:format:check

      - name: Run Web typecheck
        run: pnpm web:typecheck

      - name: Run Web unit tests
        run: pnpm web:test

      - name: Build production Web application
        run: pnpm web:build

      - name: Check DB-independent OpenAPI drift
        shell: bash
        run: |
          set -euo pipefail
          api_log="${RUNNER_TEMP}/openapi-api.log"
          uv run --project apps/api uvicorn group_interview_arena_api.app:app \
            --host 127.0.0.1 --port 8000 --lifespan off >"$api_log" 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for _ in {1..60}; do
            if ! kill -0 "$api_pid" 2>/dev/null; then
              tail -n 40 "$api_log"
              exit 1
            fi
            if curl --fail --silent --show-error http://localhost:8000/openapi.json >/dev/null; then
              ready=true
              break
            fi
            sleep 0.25
          done
          if [[ "$ready" != "true" ]]; then
            tail -n 40 "$api_log"
            exit 1
          fi

          pnpm web:api:check

  chromium-e2e:
    name: Chromium E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      POSTGRES_DB: gia_ci_admin
      POSTGRES_USER: gia_ci
      POSTGRES_PASSWORD: gia_ci_test_only

    services:
      postgres:
        image: postgres:18.4-trixie
        env:
          POSTGRES_DB: gia_ci_admin
          POSTGRES_USER: gia_ci
          POSTGRES_PASSWORD: gia_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gia_ci -d gia_ci_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          check-latest: false

      - name: Set up pnpm
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: "11.21.0"
          install: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          check-latest: false

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.4"
          enable-cache: false

      - name: Install frozen Web dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync frozen API dependencies
        working-directory: apps/api
        run: uv sync --frozen

      - name: Install Chromium browser dependencies
        run: node apps/web/node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Run real Chromium E2E
        run: pnpm web:test:e2e

      - name: Verify E2E cleanup
        if: always()
        shell: bash
        run: |
          rm -rf apps/web/test-results apps/web/playwright-report
          uv run --project apps/api python - <<'PY'
          import os
          import socket
          import psycopg

          with psycopg.connect(
              host="127.0.0.1",
              port=5432,
              dbname="postgres",
              user=os.environ["POSTGRES_USER"],
              password=os.environ["POSTGRES_PASSWORD"],
          ) as connection:
              database_rows = connection.execute(
                  "SELECT datname FROM pg_database"
              ).fetchall()
          residual = [
              database_name
              for (database_name,) in database_rows
              if database_name.startswith(("gia_p04e_", "gia_p05d_", "gia_p16d_"))
          ]

          listeners = []
          for port in (3000, 8000):
              with socket.socket() as client:
                  client.settimeout(0.5)
                  if client.connect_ex(("127.0.0.1", port)) == 0:
                      listeners.append(port)

          print(f"temporary database residual={len(residual)}")
          print(f"listener residual={listeners}")
          if residual or listeners:
              raise SystemExit("Chromium E2E cleanup verification failed.")
          PY

  beta-deployment-package:
    name: Beta deployment package
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render and audit Beta Compose topology
        shell: bash
        run: |
          set -euo pipefail
          config_json="${RUNNER_TEMP}/beta-compose.json"
          docker compose --profile ops \
            --env-file deploy/beta/.env.example \
            -f deploy/beta/compose.yaml \
            config --format json >"$config_json"

          python - "$config_json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              config = json.load(source)

          services = config["services"]
          required = {"caddy", "web", "api", "migrate", "postgres"}
          if set(services) != required:
              raise SystemExit(f"Unexpected services: {sorted(services)}")

          for name, service in services.items():
              if service.get("privileged"):
                  raise SystemExit(f"{name} must not be privileged")
              if name != "caddy" and service.get("ports"):
                  raise SystemExit(f"{name} unexpectedly publishes host ports")

          caddy_ports = {
              (int(port["target"]), port.get("protocol", "tcp"))
              for port in services["caddy"].get("ports", [])
          }
          if caddy_ports != {(80, "tcp"), (443, "tcp"), (443, "udp")}:
              raise SystemExit(f"Unexpected Caddy ports: {sorted(caddy_ports)}")

          expected_networks = {
              "caddy": {"edge"},
              "web": {"edge"},
              "api": {"edge", "data"},
              "migrate": {"data"},
              "postgres": {"data"},
          }
          for name, expected in expected_networks.items():
              actual = set(services[name].get("networks", {}))
              if actual != expected:
                  raise SystemExit(f"{name} networks {actual} != {expected}")

          if not config["networks"]["data"].get("internal"):
              raise SystemExit("data network must be internal")
          if services["migrate"].get("restart") not in ("no", ""):
              raise SystemExit("migrate must be one-shot")
          if "postgres_data" not in config.get("volumes", {}):
              raise SystemExit("PostgreSQL named volume is missing")
          PY

      - name: Validate Caddy configuration
        shell: bash
        run: |
          docker run --rm \
            -e BETA_WEB_SITE=beta.lijingai.com \
            -e BETA_API_SITE=api.beta.lijingai.com \
            -e BETA_CADDY_TLS= \
            -e CADDY_ACME_EMAIL=ci@example.invalid \
            -v "${PWD}/deploy/beta/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2.10.2-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Build Beta images
        shell: bash
        run: |
          docker compose --profile ops \
            --env-file deploy/beta/.env.example \
            -f deploy/beta/compose.yaml \
            build migrate api web

      - name: Audit image users and browser bundle
        shell: bash
        run: |
          set -euo pipefail
          test "$(docker image inspect gia-beta-web:local --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect gia-beta-api:local --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect gia-beta-api-migrate:local --format '{{.Config.User}}')" = "10001:10001"

          docker run --rm --entrypoint sh gia-beta-web:local -c '
            set -eu
            client_static=/app/apps/web/.next/static
            test -d "$client_static"
            grep -R -a -q "api.beta.lijingai.com" "$client_static"
            ! grep -R -a -E -q "localhost:8000|http://localhost:8000|https://localhost:8000" "$client_static"
          '
          docker run --rm --entrypoint python gia-beta-api:local -c \
            "import importlib.util; from group_interview_arena_api.app import app; assert app.title; assert importlib.util.find_spec('alembic') is None; assert importlib.util.find_spec('pytest') is None"
          docker run --rm --entrypoint python gia-beta-api-migrate:local -c \
            "import importlib.util; assert importlib.util.find_spec('alembic') is not None; assert importlib.util.find_spec('pytest') is None; assert importlib.util.find_spec('ruff') is None; assert importlib.util.find_spec('pyright') is None"
          docker run --rm --entrypoint alembic gia-beta-api-migrate:local heads

          for image in gia-beta-web:local gia-beta-api:local gia-beta-api-migrate:local; do
            if docker history --no-trunc "$image" | grep -E \
              'CHANGE_ME_|synthetic-never-called|hk_beta_1_synthetic_password_only'; then
              echo "Secret-like validation material found in $image history."
              exit 1
            fi
          done

      - name: Audit committed deployment files for secret material
        shell: bash
        run: |
          set -euo pipefail
          test ! -e deploy/beta/.env
          if git grep -n -E -e \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|sk-[A-Za-z0-9_-]{24,}|Bearer [A-Za-z0-9._-]{24,})' \
            -- . ':!pnpm-lock.yaml' ':!apps/api/uv.lock'; then
            echo "Potential committed secret material detected."
            exit 1
          else
            status=$?
            test "$status" -eq 1 || exit "$status"
          fi
