[project]
name = "group-interview-arena-api"
version = "0.1.0"
description = "Internal FastAPI foundation for Group Interview Arena"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.141.1",
    "opentelemetry-api>=1.44.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0,<2",
    "opentelemetry-sdk>=1.44.0,<2",
    "psycopg[binary]>=3.3.4,<3.4",
    "pwdlib[argon2]>=0.3.0,<0.4",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.51,<2.1",
    "uvicorn>=0.52.1",
    "websockets>=16.0,<17",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
cache-dir = "../../.uv-cache"
required-version = ">=0.12.2,<0.13"

[tool.pyright]
include = ["src", "tests", "migrations"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
markers = [
    "integration: requires local PostgreSQL infrastructure",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "alembic>=1.18.5,<1.19",
    "httpx>=0.28.1",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
